# Fly.io: servidor do jogo (WebSocket). O site fica na Vercel.
# O comando de start está no CMD do Dockerfile.realtime.

app = 'lero-app'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile.realtime'

[env]
  PORT = '8080'
  # Domínio(s) do site, separados por vírgula. Ajuste se o domínio da Vercel for outro.
  ALLOWED_ORIGINS = 'https://lero-app-nu.vercel.app'

[http_service]
  internal_port = 8080
  force_https = true
  # O estado do jogo fica em memória: a máquina não pode desligar nem duplicar.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
